#Goal: to build and push docker image 
 name: Docker build and push 
 on: 
   workflow_call:
 jobs: 
   build-and-push:
      runs-on: self-hosted
      steps:
          - name: checkout code 
            uses: actions/checkout@v7
        
          - name: docker login 
            uses: docker/login-action@v4
            with:
             username: ${{ secrets.DOCKERHUB_USERNAME }}
             password: ${{ secrets.DOCKERHUB_TOKEN }}
      
          - name: Build and push
            uses: docker/build-push-action@v7
            with: 
              push: true
              tags: ${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-github-actions:latest 