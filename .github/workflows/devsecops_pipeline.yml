#goal is to call the workflows in the order to implement shift left 

name: DevSecOps pipeline
on:
  push:

jobs: 
  
   #add secret scan.yml 
  secret-scan:
    uses: ./.github/workflows/secrets-scanning.yml 
    secrets: inherit 


  code-lint:  
    needs: secret-scan
    uses: ./.github/workflows/lint_and_test.yml 

  #sast
  sast:
    needs: code-lint
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit 

  #dependency scan
  dependency-scan: 
    needs: sast 
    uses: ./.github/workflows/dependency_scan.yml 


#build
  build-and-scan:
    needs: dependency-scan 
    uses: ./.github/workflows/trivy_scans.yml 
    secrets: inherit
 
 #push to docker hub 
  docker-push:
    needs: build-and-scan
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit

#deploy 
  deploy:
    secrets: inherit 
    needs: [docker-push]
    uses: ./.github/workflows/cd.yml 

  #dast [shift right]
  dast:
    secrets: inherit 
    needs: [deploy]
    uses: ./.github/workflows/dast.yml

