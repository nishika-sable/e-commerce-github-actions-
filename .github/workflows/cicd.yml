#Goal: To run the continous integration (CI)  for this project 
name: CI 
on: 
  push: 

jobs: 
  code-lint:
    uses: ./.github/workflows/lint_and_test.yml

#build
  build-and-push:
    needs: code-lint
    uses: ./.github/workflows/docker.yml
    secrets: inherit

#deploy 
 deploy:
    secrets: inherit 
    needs: [code-lint,build-and-push]
    uses: ./.github/workflows/cd.yml
