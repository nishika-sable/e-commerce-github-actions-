#goal: to scan the  dynamic running application its work is to hitt the running application 

name: Dast 
on: 
   workflow_call:

jobs:
   dast:
     runs-on: ubuntu-latest 
     steps: 
           - name: clone the repository 
             uses: actions/checkout@v4 

          
           - name: Wait for services to be healthy
             run: |
               timeout 60s bash -c 'until curl -fsS "http://${{ secrets.EC2_HOST }}:5000" > /dev/null; do
                 sleep 2
               done'

             #scan the runnning application 
           -  name: ZAP Scan
              uses: zaproxy/action-baseline@v0.15.0 #what happens with this actions these actions hits with different different types of payloads meaning it sends malicous request to the url to check if the app can handle it or not 
              with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    target: 'http://${{ secrets.EC2_HOST }}:5000'
                    fail_action: false
                    allow_issue_writing: false

