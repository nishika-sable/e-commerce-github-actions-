#goal: to scan the  dynamic running application its work is to hitt the running application 

name: Dast 
on: 
   worklow_call:

jobs:
   dast:
     runs-on: ubuntu-latest 
     steps: 
           - name: clone the repository 
             uses: actions/checkout@v4 

           - name: wait for services to be healthy 
             run: timeout 60s sh -c 'until -s http;//${{ secrets.EC2_HOST }} > /dev/null; do sleep 2; done'
             

             #scan the runnning application 
           -  name: ZAP Scan
              uses: zaproxy/action-baseline@v0.15.0
              with:
                    token: ${{ secrets.GITHUB_TOKEN }}
                    target: 'http://${{ secrets.EC2_HOST }}:5000'
                    fail_action: false
                    allow_issue_writing: false