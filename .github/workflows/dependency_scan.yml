
#Goal : TO scan the dependencies / libraries in the app

name: Dependency scan

on:
  workflow_call:

jobs:
  dependency-scan:
    strategy:
      matrix:
        python-versions: ["3.11", "3.12"]

    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-versions }}

      - name: Upgrade vulnerable setuptools
        run: python -m pip install --upgrade "setuptools>=83.0.0"    #set up tools for vulnerablity 

      - name: dependency scan for pip
        uses: pypa/gh-action-pip-audit@v1.1.0 #does only for python 

      - name: Depcheck
        uses: dependency-check/Dependency-Check_Action@main  #does for anygiven language 
        id: Depcheck
        with:
          project: 'test'
          path: '.'
          format: 'HTML'
          out: 'reports' # this is the default, no need to specify unless you wish to override it
          args: >
            --failOnCVSS 7
            --enableRetired
    
      - name: Upload Test results
        uses: actions/upload-artifact@master
        with:
           name: Depcheck report
           path: ${{github.workspace}}/reports