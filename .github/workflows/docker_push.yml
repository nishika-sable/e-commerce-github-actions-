#Goal : push the scanned image to Dockerhub /ECR /GCR/ GHCR /ACR 

#Goal: to build and push docker image 
 name: Docker  push 
 on: 
    workflow_call:
 jobs: 
   Docker-push:
      runs-on: ubuntu-latest
      steps:
          - name: checkout code 
            uses: actions/checkout@v7
          
          - name: docker setup 
            uses: docker/setup-docker-action@v5

          - name: docker login 
            uses: docker/login-action@v4
            with:
             username: ${{ secrets.DOCKERHUB_USERNAME }}
             password: ${{ secrets.DOCKERHUB_TOKEN }}
      
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
          
          - name: Docker push 
            uses: docker/build-push-action@v7
            with: 
              push: true
              tags: ${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-github-actions:latest 
              load: true

