title = "Custom Gitleaks Configuration"
[allowlist]
description = "Global allowlist for non-sensitive patterns"
paths = [
   '''gitleaks\\.toml''',
   '''\\.gitignore$''',
   '''\\.png$''',
   '''\\.jpg$'''
]
regexes = [
   '''(?i)^true|false|null$''',
   '''^dummy_secret$'''
]
[[rules]]
id = "generic-api-key"
description = "Detects generic API keys"
regex = '''(?i)(api|key|token)[\\s]*[:=][\\s]*[a-zA-Z0-9]{20,}'''
entropy = 3.5
keywords = ["api", "key", "token" "secrets"]
[[rules]]
id = "aws-access-key"
description = "Detects AWS Access Keys"
regex = '''\\b(AKIA[0-9A-Z]{16})\\b'''
entropy = 3.0
keywords = ["AKIA"]
[[rules]]
id = "slack-webhook-url"
description = "Detects Slack Webhook URLs"
regex = '''https://hooks.slack.com/services/[A-Za-z0-9/]+'''
keywords = ["hooks.slack.com"]
[[rules]]
id = "private-key"
description = "Detects private keys"
regex = '''-----BEGIN [A-Z ]+PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]