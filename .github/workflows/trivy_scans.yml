#goal : to scan the docker image before pushing 
 
name: Image scan 

on: 
  workflow_call:

jobs: 
  trivy-scan:
    runs-on: ubuntu-latest
    steps: 
          - name: checkout code 
            uses: actions/checkout@v7
          
          - name: docker setup 
            uses: docker/setup-docker-action@v5

          - name: docker login 
            uses: docker/login-action@v4
            with:
             username: ${{ secrets.DOCKERHUB_USERNAME }}   #copied from docker.yml till build and push 
             password: ${{ secrets.DOCKERHUB_TOKEN }}
      
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
          
          - name: Build 
            uses: docker/build-push-action@v7
            with: 
              push: false 
              tags: "${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-github-actions:latest"
              load: true

          - name: Run Trivy vulnerability scanner
            uses: aquasecurity/trivy-action@v0.36.0
            with:
               image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/e-commerce-github-actions:latest"
               format: 'table'
               exit-code: '1'
               ignore-unfixed: true       #if there are any critical , high vulnerability then only exit code 1 
               vuln-type: 'os,library'    #if severity is warning or info it will pass but if it is critical it will exit 
               severity: 'CRITICAL,HIGH'