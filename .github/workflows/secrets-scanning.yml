#goal: scan the code for tokens, secrets API keys, or any leaked passwords so that if found , we can
#rotate the exposed tokens/key/etc 

name: Secret scanning
on:
  workflow_call:

jobs:
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
        - name: checkout code 
          uses: actions/checkout@v4
          with:
            fetch-depth: 0 # From the very first commit pull all the code 


        - name: scan for leaks
          uses:  dortort/betterleaks-action@v0.1.0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
             config: .github/.gitleaks.toml 

        
        - name: Upload Betterleaks report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: betterleaks-report
            path: betterleaks-report.sarif
            if-no-files-found: warn

        
               
