name: show env variables 

on: 
 workflow_dispatch:
  inputs:
    environment:
      description: select the environment you want 
      required: true
      type: choice
      default: 'dev' 
      options:
        - prd
        - stg
        - dev 


env:
  NAME: Nishika 

jobs: 
   show_env:
     runs-on: ubuntu-latest 
     steps: 
       - name: show plain text 
         run: echo "my name is ${{env.NAME}}"

       - name: show secret 
         run: echo "one fun secret is ${{ secrets.MY_SECRET }}"

       - name: show variables 
         run: echo "my username is ${{ vars.MY_USERNAME }}"
