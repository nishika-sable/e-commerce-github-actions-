#GOAL: To scan the code for SAST [it checks the source for error without running the application] and code related issues using sonar cube  

name: sonar scan 
on: 
  workflow_call:

jobs:
   sast-scan:
     runs-on: ubuntu-latest
     steps:
      - name: checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        with: 
          args: >
              -Dsonar.branch.name=${{ github.ref_name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL}}
         