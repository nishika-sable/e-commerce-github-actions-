# to check if python code is syntactically correct 
name: Lint Python Code
on:
  push 

jobs:
  code-linter:
    runs-on: ubuntu-latest
    steps:
        - name: checkout code 
          uses: actions/checkout@v7
         
        - name: set up python 
          uses: actions/setup-python@v4
          with:
            python-version: '3.11'

        - name: install ruff 
          run: pip install ruff

        - name: code lint 
          run: ruff check .


