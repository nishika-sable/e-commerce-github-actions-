# to check if python code is syntactically correct 
name: Lint Python Code
on:
  push 

jobs:
  code-linter-and-tester:
    strategy:
      matrix:
       python-versions: ["3.11", "3.12",]
    runs-on: ubuntu-latest
    steps:
        - name: checkout code 
          uses: actions/checkout@v7
         
        - name: set up python 
          uses: actions/setup-python@v4
          with:
            python-version: ${{ matrix.python-versions}}

        - name: install ruff 
          run: pip install ruff

        - name: code lint 
          run: ruff check .
        
        - name: install pytest 
          run: pip install pytest

        - name: code test 
          run: pytest 

